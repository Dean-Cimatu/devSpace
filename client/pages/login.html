<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Colosseum Fighters</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/auth.js"></script>
    <script src="/js/navigation.js"></script>
    <script src="/js/ui-sound.js"></script>
    <script src="/js/login.js"></script>
</head>
<body>
    <div id="topNav">
        <a href="/"><button>Home</button></a>
        <a href="/pages/game.html"><button>Play</button></a>
        <a href="/pages/register.html"><button>Register</button></a>
        <a href="/pages/login.html"><button>Login</button></a>
        <a href="/pages/leaderboard.html"><button>Leaderboard</button></a>
    </div>

    <div class="main-content">
        <h1>Login</h1>
        <div id="loginForm">
            <form id="loginFormElement">
                <label for="username">Username:</label><br>
                <input type="text" id="username" name="username" required><br>
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" required><br><br>
                <input type="submit" value="Login">
            </form>
            <p>Don't have an account? <a href="/pages/register.html">Register here</a></p>
        </div>
    </div>
</body>
</html>
